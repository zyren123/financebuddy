# VPS 镜像:master 上构建并推到 GHCR(tag 为提交 SHA 与 latest),PR 上只构建不推送。
# VPS 是 aarch64,直接用 arm64 runner 原生构建。上线在 VPS 上手动 pull,见 vps/README.md
name: Images

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, td-cache]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: vps/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/financebuddy-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/financebuddy-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
