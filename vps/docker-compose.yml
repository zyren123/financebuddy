# 部署:见 vps/README.md。端口只绑本机,由 1Panel 的 OpenResty(host 网络)反代并负责 HTTPS
# 镜像由 CI 构建推到 GHCR;IMAGE_TAG 默认 latest,在 .env 里设成提交 SHA 即可回滚。
# 保留 build 段,本地 `docker compose build` 仍能从源码构建
# 项目名钉死:卷名 vps_redis-data 不随 compose 文件所在目录变化
name: vps

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  td-cache:
    image: ghcr.io/zyren123/financebuddy-td-cache:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: vps/td-cache/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: ghcr.io/zyren123/financebuddy-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: vps/web/Dockerfile
    # 只给口令,不给 API key
    environment:
      TD_CACHE_TOKEN: ${TD_CACHE_TOKEN:?set in vps/.env}
    ports:
      - "127.0.0.1:8788:80"
    depends_on:
      - td-cache
    restart: unless-stopped

volumes:
  redis-data:
